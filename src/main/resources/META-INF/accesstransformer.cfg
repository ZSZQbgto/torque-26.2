# AccessTransformer：把 protected / private 的字段改成 public
# 语法：<新的访问级别> <完整类名> <字段名或方法名>（加 -f 后缀表示顺便去掉 final）
#
# LivingEntityRenderer 里的 model 字段原本是 protected，
# 打开它之后，我们才能从外面把玩家渲染器的模型换成自己的子类。
public net.minecraft.client.renderer.entity.LivingEntityRenderer model

# 渲染层列表原本是 protected，打开它才能在 AddLayers 里找到原版盔甲层。
public net.minecraft.client.renderer.entity.LivingEntityRenderer layers

# 盔甲层的模型集是 private final，去掉 final 才能换成藏掉四肢的那一套。
public-f net.minecraft.client.renderer.entity.layers.HumanoidArmorLayer modelSet
